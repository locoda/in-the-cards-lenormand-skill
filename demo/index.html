<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stargazer Interpreter · Demo</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<!-- ============================================================
     PAGE WRAPPER
     ============================================================ -->
<div class="page-wrap">

  <header>
    <h1>Stargazer Interpreter</h1>
    <div class="tagline">Lenormand · Live Demo</div>
  </header>

  <!-- ==========================================================
       SECTION A — Setup
       ========================================================== -->
  <section class="section" id="section-a">
    <div class="section-label">Step 1 · Paste Daily Fortune</div>

    <!-- Website output import -->
    <div class="form-row">
      <label for="website-textarea">
        貼上
        <a href="https://stargazer.estework.site/" target="_blank" rel="noopener" style="color:var(--brand);text-decoration:underline;text-underline-offset:3px;">Stargazer's Oracle</a>
        產生的每日運勢文字
      </label>
      <textarea id="website-textarea" placeholder="請為我解讀今天的每日運勢。

【日期】2026/06/21

【牌陣】每日運勢 3 張（由左至右連讀）
1. 信 (Letter)
2. 小孩 (Child)
3. 錨 (Anchor)

請以 Lenormand 的傳統牌義，為我描繪今天整體的基調與走向。

請依以下方式解讀：
  - 以「組合」為核心，不要逐張單獨給牌義。先將相鄰的牌兩兩串連（組合 1+2：信 (Letter) + 小孩 (Child)，組合 2+3：小孩 (Child) + 錨 (Anchor)），再把三張連成一句完整、連貫的訊息。
  - 最後用一到兩句話，給我一個今天可以放在心上的「今日提醒」。"></textarea>
    </div>
    <div class="error-msg" id="website-parse-error"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="btn-parse-website">解析並複製 Prompt →</button>
    </div>
  </section>

  <!-- ==========================================================
       SECTION B — Paste Reading
       ========================================================== -->
  <section class="section" id="section-b">
    <div class="section-label">Step 2 · Paste AI Reading</div>
    <div class="form-row">
      <label for="paste-textarea">
        將 AI 回覆貼到此處
        <span class="hint">Paste the complete AI output here</span>
      </label>
      <textarea id="paste-textarea" placeholder="===STARGAZER===
QUESTION: Daily Fortune
DATE: 2026-06-22
LANGUAGE: zh
CARDS:
1: 27. 信
2: 13. 小孩
3: 35. 錨

===CHAPTER_1===
**組合 1+2：信 + 小孩**
一則訊息、通知或交流內容（信），帶著新開始、學習或嘗試的色彩（小孩）。今天可能收到一個新的安排、一項新任務，或是一個值得探索的想法。這則消息本身不一定複雜，但它會開啟某個新的方向，讓你產生進一步了解或行動的念頭。

===CHAPTER_2===
**組合 2+3：小孩 + 錨**
一個剛開始萌芽的事物（小孩），朝向穩定與落實發展（錨）。今天適合把剛出現的計畫、想法或學習內容固定下來，例如建立流程、安排時間或持續跟進。即使只是小小的開始，也有機會逐漸成為可靠的基礎。

===CHAPTER_3===
**整體意義**
今天的主旋律是：一則新的消息帶來新的開始，而這個開始有機會逐步穩定下來。事情的發展不一定快速或戲劇化，但有利於把新的資訊、新的機會或新的嘗試，轉化成實際且可持續的成果。今天適合接受新資訊，並為後續發展建立穩固的第一步。

===CHAPTER_4===
**今日提醒**
留意今天收到的訊息或通知，不要因為看起來微不足道就忽略它。
如果有新的想法或機會出現，先採取一個小而具體的行動，把它落實到日常安排中。

===SUMMARY===
今天的能量圍繞著「新消息」與「穩定發展」。某個新的資訊、學習機會或計畫可能進入你的生活，並且具有長期延續的潛力。與其急著看到成果，不如專注於建立規律與基礎。小小的開始，今天特別值得認真對待。

===END==="></textarea>
    </div>
    <div class="error-msg" id="parse-error"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="btn-generate">生成預覽</button>
    </div>
  </section>

  <!-- ==========================================================
       SECTION C — Preview
       ========================================================== -->
  <div class="section-c-wrap" id="section-c-wrap">
    <section class="section" id="section-c">
      <div class="section-label">Step 3 · Preview & Download</div>
      <div class="preview-header">
        <span class="preview-meta" id="preview-meta"></span>
        <button class="btn btn-primary" id="btn-download">⬇ 下載長圖</button>
      </div>
      <div class="preview-container" id="preview-container">
        <!-- Poster clones inserted here -->
      </div>
    </section>
  </div>

</div><!-- /page-wrap -->

<!-- ============================================================
     SECTION D — Render target (hidden, off-screen)
     ============================================================ -->
<div id="render-target" class="render-target">
  <!-- Content built here by renderer -->
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Loading overlay -->
<div class="spinner-overlay" id="spinner">
  <div class="spinner-box">
    <div class="spinner"></div>
    <div class="spinner-msg" id="spinner-msg">載入中...</div>
  </div>
</div>

<script src="../cards-data.js"></script>
<script src="script.js"></script>
</body>
</html>
