<!doctype html>

<!-- HOW IT WORKS -->
<div class="section-divider"><hr></div>
<section id="how-it-works"><div class="container">
  <div class="section-header">
    <div class="section-label" data-i18n="workflow.heading"></div>
    <h2 class="section-title" data-i18n="workflow.title"></h2>

  </div>
</div></section>

<!-- PRODUCT SHOWCASE -->
<div class="section-divider"><hr></div>
<section id="showcase"><div class="container">
  <div class="section-header">
    <div class="section-label" data-i18n="showcase.heading"></div>
    <h2 class="section-title" data-i18n="showcase.title"></h2>
    <p class="section-subtitle" data-i18n="showcase.subtitle"></p>
  </div>
  <div class="product-tabs">
    <button class="product-tab active" data-tab="a4-pdf" onclick="switchTab('a4-pdf')" data-i18n="showcase.tab_pdf"></button>
    <button class="product-tab" data-tab="web-page" onclick="switchTab('web-page')" data-i18n="showcase.tab_web"></button>
    <button class="product-tab" data-tab="social-card" onclick="switchTab('social-card')" data-i18n="showcase.tab_social"></button>
  </div>

  <div class="product-panel active" id="panel-a4-pdf"><div class="product-showcase-card">
    <div class="preview-grid">
      <div class="preview-img-wrap"><img src="previews/showcase-pdf-1.png" alt="A4 PDF Cover"></div>
      <div class="preview-img-wrap"><img src="previews/showcase-pdf-2.png" alt="A4 PDF Content"></div>
    </div>
    <p class="product-desc" data-i18n="showcase.pdf_desc"></p>
  </div></div>

  <div class="product-panel" id="panel-web-page"><div class="product-showcase-card">
    <div class="iframe-showcase"><iframe src="previews/lenormand-web-下半年運勢-2026-06-20.html" title="Sample Web Page"></iframe></div>
    <p class="product-desc" data-i18n="showcase.web_desc"></p>
  </div></div>

  <div class="product-panel" id="panel-social-card"><div class="product-showcase-card">
    <div class="preview-grid">
      <div class="preview-img-wrap"><img src="previews/lenormand-xhs-下半年運勢-2026-06-20-01.png" alt="Social Card 1"></div>

      <div class="preview-img-wrap"><img src="previews/lenormand-xhs-下半年運勢-2026-06-20-03.png" alt="Social Card 3"></div>
      <div class="preview-img-wrap"><img src="previews/lenormand-xhs-下半年運勢-2026-06-20-04.png" alt="Social Card 4"></div>

  </div></div>
</div></section>

<!-- SPREAD TYPES -->

<section id="spreads"><div class="container">
  <div class="section-header">
    <div class="section-label" data-i18n="spreads.heading"></div>
    <h2 class="section-title" data-i18n="spreads.title"></h2>
  </div>
  <div class="spreads-grid">
    <div class="spread-card animate-in"><div class="spread-visual"><div class="spread-dots"><span class="spread-dot accent"></span></div></div><h3 data-i18n="spreads.s1_title"></h3><p data-i18n="spreads.s1_desc"></p></div>
    <div class="spread-card animate-in"><div class="spread-visual"><div class="spread-dots" style="gap:16px"><span class="spread-dot accent"></span><span class="spread-dot"></span></div></div><h3 data-i18n="spreads.s2_title"></h3><p data-i18n="spreads.s2_desc"></p></div>

    <div class="spread-card animate-in"><div class="spread-visual"><div class="spread-dots" style="display:grid;grid-template-columns:repeat(3,1fr);place-items:center;gap:4px"><span class="spread-dot"></span><span class="spread-dot"></span><span class="spread-dot"></span><span class="spread-dot" style="width:100%;height:1px;background:var(--sage);border-radius:0;grid-column:1/-1"></span><span class="spread-dot accent"></span><span class="spread-dot accent"></span><span class="spread-dot accent"></span></div></div><h3 data-i18n="spreads.s6_title"></h3><p data-i18n="spreads.s6_desc"></p></div>
  </div>
</div></section>

<!-- CARD GALLERY -->

<!-- INSTALL -->
<div class="section-divider"><hr></div>
<section id="install"><div class="container">
  <div class="section-header">
    <div class="section-label" data-i18n="install.heading"></div>
    <h2 class="section-title" data-i18n="install.title"></h2>
  </div>
  <div class="install-block">
    <p class="install-note" data-i18n="install.note"></p>

      <summary style="font-family:var(--sans);font-size:0.85rem;color:var(--text-muted);cursor:pointer" data-i18n="install.git_manual"></summary>
      <div class="code-block" style="margin-top:0.75rem">
        <span class="comment"># Repo: https://github.com/locoda/stargazer-interpreter</span><br>
        <span class="cmd">git clone</span> https://github.com/locoda/stargazer-interpreter.git \<br>
        &nbsp;&nbsp;<span class="path">~/your-agent/skills/stargazer-interpreter/</span>
      </div>

    <div class="install-badges">

      </a>
      <a href="https://stargazer.estework.site/" target="_blank" rel="noopener" class="badge-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>

      <a href="https://agentskills.io" target="_blank" rel="noopener" class="badge-link">Agent Skills Standard</a>

  </div>
</div></section>
